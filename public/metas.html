<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzly - Metas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="brand-container">
            <img src="finanzly_verde.png" id="logo-finanzly" alt="Logo Finanzly" class="brand-icon">
            <div class="brand-text">
                <h1 class="brand-name">FINANZLY</h1>
                <span class="brand-slogan">GESTIÓN INTELIGENTE</span>
            </div>
        </div>
        <nav class="main-nav">
            <a href="index.html" class="nav-item">🏠 Inicio</a>
            <a href="transacciones.html" class="nav-item">🔄 Transacciones</a>
            <a href="metas.html" class="nav-item active">🎯 Metas</a>
            <button id="theme-toggle" class="theme-toggle-btn" title="Cambiar modo">🌙</button>
        </nav>
    </header>

    <main class="content">
        <div class="content-header">
            <h1>Metas de Ahorro</h1>
            <button class="btn-primary" id="btn-nueva-meta">+ Nueva Meta</button>
        </div>

        <div class="goals-grid" id="lista-metas">
        </div>
    </main>

    <div id="modal-meta" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configurar Nueva Meta</h2>
                <button id="close-modal-meta" class="close-btn">&times;</button>
            </div>
            
            <form id="form-meta">
                <div class="input-group">
                    <label>Nombre de la Meta</label>
                    <input type="text" id="meta-nombre" placeholder="Ej: Fondo de Emergencia" required>
                </div>
                <div class="input-group">
                    <label>Monto Objetivo ($)</label>
                    <input type="text" id="meta-monto" placeholder="100.000" inputmode="numeric" required>
                </div>
                <div class="input-group">
                    <label>Ahorro Actual ($)</label>
                    <input type="text" id="meta-actual" placeholder="0" inputmode="numeric">
                </div>
                
                <div class="input-group">
                    <label style="margin-bottom: 10px; display: block;">Seleccione método de plazo:</label>
                    
                    <div style="margin-bottom: 10px;">
                        <label style="font-weight: 500; cursor: pointer;">
                            <input type="radio" name="tipo-plazo" value="manual" id="radio-manual" checked> Plazo estimado (Fecha)
                        </label>
                        <input type="date" id="meta-fecha-fin" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px;">
                    </div>

                    <div style="margin-bottom: 10px;">
                        <label style="font-weight: 500; cursor: pointer;">
                            <input type="radio" name="tipo-plazo" value="automatico" id="radio-auto"> Plazo estimado (Meses)
                        </label>
                        <input type="number" id="meta-meses" min="1" value="3" disabled style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px;">
                    </div>
                </div>

                <div class="input-group">
                    <label>Ahorro Mensual Sugerido ($)</label>
                    <input type="text" id="meta-cuota" placeholder="Se calculará automáticamente" readonly style="cursor: not-allowed; font-weight: 600;">
                </div>

                <button type="submit" class="btn-submit">Guardar Meta</button>
            </form>
        </div>
    </div>

            </div>
    </div>

    <!-- MODAL: CONFIRMAR ELIMINAR META -->
    <div id="modal-confirmar-eliminar" class="modal-overlay" style="display: none;">
        <div class="modal-content modal-content-small">
            <div class="modal-header">
                <h2 id="modal-confirmar-eliminar-title" style="color: var(--red);"></h2>
                <button type="button" class="close-btn" id="close-confirmar-eliminar">&times;</button>
            </div>
            <p id="modal-confirmar-eliminar-message" style="text-align: center; margin-bottom: 20px; font-size: 0.95rem; color: var(--text-muted);"></p>
            <div style="display: flex; gap: 10px;">
                <button type="button" id="btn-cancelar-eliminar" class="btn-submit" style="background-color: var(--border); color: var(--text-main); margin-top: 0;">No, volver</button>
                <button type="button" id="btn-confirmar-eliminar" class="btn-submit" style="background-color: var(--red); margin-top: 0;">Sí, eliminar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: ABONAR A META -->
    <div id="modal-abono-meta" class="modal-overlay" style="display: none;">
        <div class="modal-content modal-content-small">
            <div class="modal-header">
                <h2>Abonar a Meta</h2>
                <button type="button" class="close-btn" id="close-abono-meta">&times;</button>
            </div>
            <form id="form-abono-meta">
                <div class="input-group">
                    <label>¿Cuánto dinero deseas sumar a esta meta?</label>
                    <input type="text" id="monto-abono" placeholder="0" required>
                </div>
                <button type="submit" id="btn-regar-meta" class="btn-submit" disabled>Regar la meta</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
 </body>
 </html>
